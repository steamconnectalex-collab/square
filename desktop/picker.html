<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Compartilhar tela</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;color:#1d1d22;background:#fff;display:flex;flex-direction:column;height:100vh}
h1{font-size:18px;margin:0;padding:18px 20px 4px}p{margin:0;padding:0 20px 12px;color:#666}
.tabs{display:flex;gap:8px;padding:0 20px 10px}.tabs button{border:1px solid #ddd;background:#f4f4f6;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
.tabs button.on{background:#2DA770;color:#fff;border-color:#2DA770}
.grid{flex:1;overflow:auto;padding:4px 20px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-content:start}
.it{border:2px solid transparent;border-radius:12px;background:#f4f4f6;padding:8px;cursor:pointer;text-align:left;font:inherit}
.it img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#ddd;display:block}
.it span{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.on{border-color:#2DA770;background:#e9f7f0}
.bar{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid #eee}
.bar button{border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;background:#eee}
.bar .go{background:#2DA770;color:#fff}.bar .go:disabled{opacity:.4;cursor:default}
</style></head><body>
<h1>Compartilhar tela</h1><p>Escolha o que as outras pessoas vão ver.</p>
<div class="tabs"><button id="t-screen" class="on">Telas</button><button id="t-window">Janelas</button></div>
<div class="grid" id="g"></div>
<div class="bar"><button id="no">Cancelar</button><button id="ok" class="go" disabled>Compartilhar</button></div>
<script>
let all=[],kind='screen',sel=null;
const g=document.getElementById('g'),ok=document.getElementById('ok');
function draw(){g.textContent='';all.filter(s=>s.kind===kind).forEach(s=>{
 const b=document.createElement('button');b.className='it'+(s.id===sel?' on':'');
 const i=document.createElement('img');i.src=s.thumb;const n=document.createElement('span');n.textContent=s.name;
 b.append(i,n);b.onclick=()=>{sel=s.id;draw();ok.disabled=false};b.ondblclick=()=>picker.choose(s.id);g.append(b)});
 if(!g.children.length){g.textContent='Nada para mostrar aqui.'}}
function tab(k){kind=k;sel=null;ok.disabled=true;document.getElementById('t-screen').className=k==='screen'?'on':'';document.getElementById('t-window').className=k==='window'?'on':'';draw()}
document.getElementById('t-screen').onclick=()=>tab('screen');
document.getElementById('t-window').onclick=()=>tab('window');
document.getElementById('no').onclick=()=>picker.choose(null);
ok.onclick=()=>picker.choose(sel);
picker.onSources(l=>{all=l;if(!all.some(s=>s.kind==='screen')&&all.length)kind='window';tab(kind)});
</script></body></html>

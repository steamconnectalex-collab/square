name: shiqi-core

on:
  push:
    branches: [shiqi-parallel-dev]
    paths:
      - "shiqi-parallel/services/core/**"
      - ".github/workflows/shiqi-core.yml"
  pull_request:
    branches: [shiqi-parallel-dev]
    paths:
      - "shiqi-parallel/services/core/**"
      - ".github/workflows/shiqi-core.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiqi-parallel/services/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shiqi-parallel/services/core
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings

name: shiqi-core

on:
  push:
    branches: [shiqi-parallel-dev]
    paths:
      - "shiqi-parallel/services/core/**"
      - ".github/workflows/shiqi-core.yml"
  pull_request:
    branches: [shiqi-parallel-dev]
    paths:
      - "shiqi-parallel/services/core/**"
      - ".github/workflows/shiqi-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiqi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiqi-parallel/services/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shiqi-parallel/services/core
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

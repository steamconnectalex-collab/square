name: shiqi-core

on:
  push:
    branches: [shiqi-parallel-dev]
    paths:
      - "shiqi-parallel/services/core/**"
      - "shiqi-parallel/apps/web/**"
      - "shiqi-parallel/tests/**"
      - "shiqi-parallel/supabase/**"
      - "shiqi-parallel/docs/**"
      - "shiqi-parallel/task.md"
      - "task.md"
      - ".github/workflows/shiqi-core.yml"
  pull_request:
    branches: [shiqi-parallel-dev]
    paths:
      - "shiqi-parallel/services/core/**"
      - "shiqi-parallel/apps/web/**"
      - "shiqi-parallel/tests/**"
      - "shiqi-parallel/supabase/**"
      - "shiqi-parallel/docs/**"
      - "shiqi-parallel/task.md"
      - "task.md"
      - ".github/workflows/shiqi-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiqi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-jwks:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect parallel Supabase JWKS (public metadata only)
        shell: bash
        run: |
          set -euo pipefail
          url="https://ujdosskjycrdkcgsswfa.supabase.co/auth/v1/.well-known/jwks.json"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$url" -o /tmp/shiqi-jwks.json
          jq -e '.keys | type == "array" and length > 0' /tmp/shiqi-jwks.json >/dev/null
          echo "Public JWKS key metadata (no key material):"
          jq -r '.keys[] | [.kid // "no-kid", .kty // "no-kty", .alg // "alg-not-declared", .crv // "no-curve"] | @tsv' /tmp/shiqi-jwks.json
          algorithms="$(jq -r '[.keys[] | (.alg // (if .kty == "EC" and .crv == "P-256" then "ES256" elif .kty == "RSA" then "RS256" else "UNSUPPORTED" end))] | unique | .[]' /tmp/shiqi-jwks.json)"
          echo "Detected algorithms: $(echo "$algorithms" | paste -sd, -)"
          if grep -qx "UNSUPPORTED" <<< "$algorithms"; then
            echo "::error::Supabase JWKS contains a key type/algorithm not supported by shiqi-core."
            exit 1
          fi
          while IFS= read -r algorithm; do
            case "$algorithm" in
              ES256|RS256) ;;
              *) echo "::error::Unsupported Supabase JWT algorithm: $algorithm"; exit 1 ;;
            esac
          done <<< "$algorithms"
          echo "JWKS algorithm compatibility check passed."

  web-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiqi-parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find apps/web -type f -name '*.js' ! -name 'qr.js' -print0)
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Auth Edge Function
        run: deno check --no-lock supabase/functions/auth/index.ts
      - name: Smoke-test parallel Auth Edge Function
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --max-time 20 https://ujdosskjycrdkcgsswfa.supabase.co/functions/v1/auth/health)"
          node -e 'const d=JSON.parse(process.argv[1]); if(d.ok!==true || d.email_configured!==true) process.exit(1)' "$health"
          status="$(curl --silent --show-error --max-time 20 -o /tmp/shiqi-auth-negative.json -w '%{http_code}' -X POST https://ujdosskjycrdkcgsswfa.supabase.co/functions/v1/auth/account/delete -H 'content-type: application/json' --data '{"confirm":"EXCLUIR"}')"
          test "$status" = "401"
      - name: Check frontend/Rust upload contract
        run: node tests/rust-frontend-contract.js
      - name: Check Auth and database security contract
        run: node tests/auth-contract-static.js
      - name: Check frontend/SQL RPC parity
        run: node tests/frontend-sql-contract.js
      - name: Install Playwright for isolated browser regression
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run parallel frontend browser smoke tests
        run: node tests/smoke.js

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiqi-parallel/services/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shiqi-parallel/services/core
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build shiqi-core container image
        run: docker build --pull --tag shiqi-core:ci .

  railway-smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [rust, supabase-jwks]
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Railway service and protected route
        shell: bash
        run: |
          set -euo pipefail
          base="https://shiqi-core-development.up.railway.app"
          retry() {
            local url="$1"
            local expected="$2"
            local body="/tmp/shiqi-response.json"
            local code=""
            for attempt in $(seq 1 30); do
              code="$(curl --silent --show-error --max-time 10 -o "$body" -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "$expected" ]]; then
                cat "$body"
                return 0
              fi
              echo "Aguardando endpoint (tentativa $attempt/30): HTTP ${code:-sem resposta}; esperado $expected"
              sleep 10
            done
            echo "::error::Endpoint $url não retornou HTTP $expected."
            [[ -f "$body" ]] && cat "$body"
            return 1
          }
          retry "$base/healthz" "200"
          jq -e '.service == "shiqi-core" and .status == "ok"' /tmp/shiqi-response.json >/dev/null
          retry "$base/readyz" "200"
          jq -e '.service == "shiqi-core" and .status == "ready"' /tmp/shiqi-response.json >/dev/null
          retry "$base/v1/me" "401"
          jq -e '.ok == false and .error == "unauthorized"' /tmp/shiqi-response.json >/dev/null
          echo "Railway runtime smoke checks passed (health, readiness, unauthenticated route rejection)."
